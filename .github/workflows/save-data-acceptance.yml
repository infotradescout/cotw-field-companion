name: Save data acceptance
on:
  push:
    branches: [feat/save-data-workspace-20260921]
permissions:
  contents: read
concurrency:
  group: save-data-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24
      - name: Archive exact candidate source
        run: |
          mkdir -p acceptance
          git rev-parse HEAD > acceptance/source-revision.txt
          git archive --format=zip HEAD -o acceptance/source.zip
      - name: Install relay test dependencies
        run: npm ci --prefix cloud --ignore-scripts --no-audit --no-fund
      - name: Run repository tests
        run: |
          set -o pipefail
          npm test 2>&1 | tee acceptance/tests.log
      - name: Build public assets
        run: |
          set -o pipefail
          npm run build:web 2>&1 | tee acceptance/build.log
      - name: Preserve source and executed acceptance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: save-data-${{ github.sha }}
          path: acceptance/
          if-no-files-found: error
          retention-days: 7
